# Windows desktop setup, including the offline 3D Results viewer.
# Run from the repository root: conda env create --file environment.yml
# Keep RDKit, Cairo, and Qt on one channel; do not add pip native runtime wheels.
name: moldockpipe-clean
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  # This build supplies pip metadata, preventing MolScrub's dependency resolver
  # from installing a second RDKit over the Conda-managed package.
  - rdkit=2026.03.*
  # conda-forge uses these names for the Qt 6 bindings (pyqt is Qt 5 there).
  - pyqt6=6.11.*
  - pyqt6-webengine=6.11.*
  - pip
  - git
  - pip:
      # pyproject.toml remains the source of truth for Python dependencies.
      - -e .[chemistry,dev]
